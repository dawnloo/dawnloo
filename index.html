<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="nav-links">
      <a href="#portfolio" class="active">Portfolio</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <a href="#store">Store</a>
    </div>
  </nav>

  <!-- Header Branding -->
  <header class="site-header">
    <h1 class="brand-name">YOUR NAME</h1>
    <p class="brand-subtitle">Cartoonist / Illustrator / Designer</p>
  </header>

  <main class="content">
    <section id="portfolio">
      <h2 class="section-title">PORTFOLIO</h2>

      <!-- Project Row 1 -->
      <article class="project-item">
        <h3 class="project-title">Project Title One</h3>
        <div class="image-wrapper">
          <img src="images/project1.jpg" alt="Project 1 Preview" />
        </div>
      </article>

      <!-- Project Row 2 -->
      <article class="project-item">
        <h3 class="project-title">Project Title Two</h3>
        <div class="image-wrapper">
          <img src="images/project2.jpg" alt="Project 2 Preview" />
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Your Name</p>
  </footer>

</body>
</html>
